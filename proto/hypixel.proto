syntax = "proto3";

option go_package = "github.com/guild-link/hypixel-grpc/proto";
package hypixel;


service SkyBlock {
  rpc GetNetworth(SkyBlockRequest) returns (NetworthResponse);
  rpc GetDungeons(SkyBlockRequest) returns (DungeonsResponse);
  rpc GetFarming(SkyBlockRequest) returns (FarmingResponse);
}

message User {
  string name = 1;
  string id = 2;
}

message Profile {
  string name = 1;
  string id = 2;
}

message SkyBlockRequest {
  string username = 1;
  string profile = 2;
}

message NetworthResponse {
  User user = 1;
  Profile profile = 2;
  double total = 3;
  double unsoulbound = 4;
}

message FarmingResponse {
  User user = 1;
  Profile profile = 2;
  double farming_level = 3;
  double garden_level = 4;
  double farming_xp = 5;
  double garden_xp = 6;
  double weight = 7;
}

enum DungeonClass {
  DUNGEON_CLASS_UNKNOWN = 0;
  DUNGEON_CLASS_BERSERK = 1;
  DUNGEON_CLASS_HEALER = 2;
  DUNGEON_CLASS_ARCHER = 3;
  DUNGEON_CLASS_MAGE = 4;
  DUNGEON_CLASS_TANK = 5;
}

enum DungeonMode {
  DUNGEON_MODE_UNKNOWN = 0;
  DUNGEON_MODE_CATACOMBS = 1;
  DUNGEON_MODE_MASTER_CATACOMBS = 2;
}

message DungeonClassLevel {
  DungeonClass dungeon_class = 1;
  double level = 2;
}

message DungeonFloorStats {
  DungeonMode mode = 1;
  uint32 floor = 2;
  uint32 completions = 3;
  optional double personal_best = 4;
}

message DungeonsResponse {
  User user = 1;
  Profile profile = 2;
  double catacombs_level = 3;
  DungeonClass selected_class = 4;
  double selected_class_level = 5;
  uint32 secrets_found = 6;
  repeated DungeonClassLevel classes = 7;
  repeated DungeonFloorStats floors = 8;
}
